<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Save Bookmark</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 320px;
      margin: 0;
      padding: 14px;
      background: #f9fafb;
      color: #111827;
    }
    h2 { font-size: 15px; margin: 0 0 10px; }
    label { display: block; font-size: 12px; font-weight: 600; margin: 8px 0 4px; color: #374151; }
    input[type="text"], input[type="number"], input[type="password"] {
      width: 100%;
      box-sizing: border-box;
      padding: 6px 8px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 13px;
    }
    .row { display: flex; gap: 12px; margin-top: 10px; font-size: 12px; }
    .row label { display: flex; align-items: center; gap: 5px; margin: 0; font-weight: 500; }
    button {
      width: 100%;
      margin-top: 12px;
      padding: 8px;
      border: none;
      border-radius: 6px;
      background: #2563eb;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: wait; }
    .status { margin-top: 8px; font-size: 12px; min-height: 16px; }
    .ok { color: #059669; }
    .err { color: #dc2626; }
    details { margin-top: 10px; font-size: 12px; }
    summary { cursor: pointer; color: #4b5563; }
  </style>
</head>
<body>
  <h2>Save to Beacon</h2>
  <label for="title">Title</label>
  <input id="title" type="text" placeholder="Page title" />

  <label for="url">URL</label>
  <input id="url" type="text" placeholder="https://..." />

  <label for="tags">Tags (comma-separated)</label>
  <input id="tags" type="text" placeholder="reading, dev, tools" />

  <div class="row">
    <label><input id="readLater" type="checkbox" /> Read Later</label>
    <label><input id="saveSnapshot" type="checkbox" /> Offline Snapshot</label>
  </div>

  <button id="saveBtn">Save Bookmark</button>
  <div id="status" class="status"></div>

  <details>
    <summary>Desktop App Connection</summary>
    <label for="port">Local Port</label>
    <input id="port" type="number" value="48123" />
    <label for="token">API Token (from Settings)</label>
    <input id="token" type="password" placeholder="Paste API token" />
  </details>

  <script src="popup.js"></script>
</body>
</html>
